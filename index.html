        <svg class="flora flora-r" viewBox="0 0 260 1200" preserveAspectRatio="xMinYMid slice" focusable="false">
            <circle class="spark" cx="57" cy="592" r="1.9" style="--d:4.7s"/>
            <circle class="spark" cx="58" cy="1155" r="1.2" style="--d:4.7s"/>
            <circle class="spark" cx="94" cy="1081" r="1.4" style="--d:4.1s"/>
            <circle class="spark" cx="143" cy="800" r="1.3" style="--d:5.5s"/>
            <circle class="spark" cx="146" cy="133" r="2.2" style="--d:0.5s"/>
            <circle class="spark" cx="31" cy="954" r="2.1" style="--d:5.7s"/>
            <circle class="spark" cx="102" cy="614" r="1.5" style="--d:3.4s"/>
            <circle class="spark" cx="149" cy="776" r="2.3" style="--d:1.2s"/>
            <circle class="spark" cx="116" cy="878" r="1.3" style="--d:4.9s"/>
        </svg>
    </div>

    <main class="shell">
        <header class="masthead">
            <p class="eyebrow" id="today"></p>
            <h1>Tasks</h1>
            <p class="summary" id="summary" aria-live="polite"></p>
        </header>

        <form class="composer glass" id="composer" autocomplete="off">
            <input id="todo-input" type="text" placeholder="Add a task…" aria-label="New task" enterkeyhint="done" maxlength="500">
            <button id="add-button" type="submit" class="add" aria-label="Add task">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </form>

        <ul id="todo-list" class="todo-list" aria-label="Your tasks" aria-describedby="gestures"></ul>
        <p class="sr-only" id="gestures">Double-tap a task to mark it as a priority. Press and hold a task, or right-click it, for more options.</p>

        <p class="empty" id="empty" hidden>Nothing here yet.<br>Add your first task above.</p>

        <footer class="foot" id="foot" hidden>
            <button type="button" class="ghost" id="clear-done">Clear completed</button>
        </footer>
    </main>

    <div class="toast glass" id="toast" role="status" aria-live="polite" hidden>
        <span id="toast-msg"></span>
        <button type="button" id="toast-undo">Undo</button>
    </div>

    <!-- press and hold a task: its menu, and the reminder editor the menu leads to -->
    <dialog class="modal" id="menu" aria-labelledby="menu-title">
        <div class="sheet glass" id="menu-sheet" tabindex="-1">
            <div class="sheet-body">
                <section id="view-menu">
                    <h2 class="sheet-title" id="menu-title"></h2>
                    <div class="menu-list">
                        <button type="button" class="menu-item" data-act="priority">
                            <span class="menu-icon" data-icon="star"></span>
                            <span class="menu-text"><span class="menu-label">Mark as priority</span></span>
                        </button>
                        <button type="button" class="menu-item" data-act="remind">
                            <span class="menu-icon" data-icon="bell"></span>
                            <span class="menu-text"><span class="menu-label">Set a reminder</span><span class="menu-meta"></span></span>
                        </button>
                        <button type="button" class="menu-item" data-act="edit">
                            <span class="menu-icon" data-icon="edit"></span>
                            <span class="menu-text"><span class="menu-label">Edit</span></span>
                        </button>
                        <button type="button" class="menu-item" data-act="copy">
                            <span class="menu-icon" data-icon="copy"></span>
                            <span class="menu-text"><span class="menu-label">Copy text</span></span>
                        </button>
                        <div class="menu-rule" role="presentation"></div>
                        <button type="button" class="menu-item danger" data-act="delete">
                            <span class="menu-icon" data-icon="trash"></span>
                            <span class="menu-text"><span class="menu-label">Delete</span></span>
                        </button>
                    </div>
                </section>

                <section id="view-remind" hidden>
                    <div class="sheet-top">
                        <p class="sheet-lead">Remind me about</p>
                        <button type="button" class="sheet-x" id="remind-cancel" aria-label="Close" data-icon="close"></button>
                    </div>
                    <h2 class="sheet-title" id="remind-title"></h2>

                    <div class="presets" role="group" aria-label="Quick times">
                        <button type="button" class="pill" data-preset="15m">In 15 min</button>
                        <button type="button" class="pill" data-preset="1h">In 1 hour</button>
                        <button type="button" class="pill" data-preset="3h">In 3 hours</button>
                    </div>

                    <div class="when">
                        <label class="field"><span class="field-cap">Date</span><input type="date" id="remind-date" aria-describedby="remind-hint"></label>
                        <div class="field"><span class="field-cap" id="remind-time-cap">Time</span><button type="button" class="field-btn" id="remind-time" aria-labelledby="remind-time-cap remind-time" aria-describedby="remind-hint"><span id="remind-time-text"></span><span class="field-icon" data-icon="clock"></span></button></div>
                    </div>
                    <p class="remind-hint" id="remind-hint"></p>

                    <div class="tone">
                        <button type="button" class="tone-play" id="tone-play" aria-label="Play the ringtone"></button>
                        <div class="tone-text"><span class="field-cap">Ringtone</span><span class="tone-name" id="tone-name">Chime</span></div>
                        <button type="button" class="pill" id="tone-reset" hidden>Default</button>
                        <button type="button" class="pill" id="tone-pick">Choose…</button>
                        <input type="file" id="tone-file" class="sr-only" accept="audio/*" tabindex="-1" aria-hidden="true">
                    </div>
                    <p class="tone-note" id="tone-note" role="alert" hidden></p>

                    <div class="sheet-actions">
                        <button type="button" class="btn quiet danger" id="remind-clear" hidden>Remove reminder</button>
                        <button type="button" class="btn solid" id="remind-save">Set reminder</button>
                    </div>
                </section>

                <!-- the clock the reminder's time is read off: the hours first, then the minutes -->
                <section id="view-clock" hidden>
                    <h2 class="sr-only" id="clock-title">Choose a time</h2>
                    <div class="clock-read">
                        <button type="button" class="clock-seg" id="clock-hour"><span></span></button>
                        <span class="clock-colon" aria-hidden="true">:</span>
                        <button type="button" class="clock-seg" id="clock-minute"><span></span></button>
                        <div class="clock-half" id="clock-half" role="group" aria-label="Before or after noon" hidden>
                            <button type="button" class="pill" data-half="am"></button>
                            <button type="button" class="pill" data-half="pm"></button>
                        </div>
                    </div>

                    <div class="dial" id="dial" role="slider" tabindex="0">
                        <div class="dial-hand" aria-hidden="true"><span class="dial-knob"></span></div>
                        <div class="dial-ring" id="dial-hours" aria-hidden="true"></div>
                        <div class="dial-ring off" id="dial-minutes" aria-hidden="true"></div>
                    </div>

                    <div class="sheet-actions">
                        <button type="button" class="btn quiet" id="clock-cancel">Cancel</button>
                        <button type="button" class="btn solid" id="clock-done">Done</button>
                    </div>
                </section>
            </div>
        </div>
    </dialog>

    <!-- a reminder that has come due -->
    <dialog class="modal alarm" id="alarm" role="alertdialog" aria-labelledby="alarm-title" aria-describedby="alarm-task alarm-when">
        <div class="sheet glass" id="alarm-sheet" tabindex="-1">
            <div class="sheet-body">
                <div class="alarm-bell" data-icon="bell"></div>
                <p class="sheet-lead" id="alarm-title">Reminder</p>
                <h2 class="alarm-task" id="alarm-task"></h2>
                <p class="alarm-when" id="alarm-when"></p>
                <div class="alarm-actions">
                    <button type="button" class="btn solid" data-answer="done">Mark as done</button>
                    <button type="button" class="btn soft" data-answer="snooze">Snooze 10 min</button>
                    <button type="button" class="btn quiet" data-answer="dismiss">Dismiss</button>
                </div>
                <p class="alarm-more" id="alarm-more" hidden></p>
            </div>
        </div>
    </dialog>

    <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
