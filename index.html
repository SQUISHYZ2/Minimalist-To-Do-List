<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tasks</title>
    <meta name="description" content="A quiet, glassy to-do list.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eceef6" media="(prefers-color-scheme: light)">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="manifest" href="manifest.json">

    <link rel="icon" type="image/png" href="icons/apple-icon-180.png">
    <link rel="apple-touch-icon" href="icons/apple-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tasks">
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
        <span class="grain"></span>
    </div>

    <!-- shared paint for the priority star -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="irid" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff9bd8"/>
                <stop offset=".25" stop-color="#ffc27a"/>
                <stop offset=".5" stop-color="#f7f58f"/>
                <stop offset=".7" stop-color="#86ffbf"/>
                <stop offset=".85" stop-color="#7fdcff"/>
                <stop offset="1" stop-color="#a893ff"/>
            </linearGradient>
        </defs>
    </svg>

    <main class="shell">
        <header class="masthead">
            <p class="eyebrow" id="today"></p>
            <h1>Tasks</h1>
            <p class="summary" id="summary" aria-live="polite"></p>
        </header>

        <form class="composer glass" id="composer" autocomplete="off">
            <input id="todo-input" type="text" placeholder="Add a task…" aria-label="New task" enterkeyhint="done" maxlength="500">
            <button id="add-button" type="submit" class="add" aria-label="Add task">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </form>

        <ul id="todo-list" class="todo-list" aria-label="Your tasks"></ul>

        <p class="empty" id="empty" hidden>Nothing here yet.<br>Add your first task above.</p>

        <footer class="foot" id="foot" hidden>
            <button type="button" class="ghost" id="clear-done">Clear completed</button>
        </footer>
    </main>

    <div class="toast glass" id="toast" role="status" aria-live="polite" hidden>
        <span id="toast-msg"></span>
        <button type="button" id="toast-undo">Undo</button>
    </div>

    <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
